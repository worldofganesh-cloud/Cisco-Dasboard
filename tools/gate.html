<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cisco Global Command Center</title>
<style>
:root { --page:#0b1220; --surface:#111a2e; --line:#2c3b59; --ink:#e6ebf3; --ink2:#a9b4c6; --muted:#7d8aa0; --accent:#3987e5; --bad:#ef6b6b; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --page:#f3f5f9; --surface:#ffffff; --line:#d3d9e3; --ink:#0f172a; --ink2:#475569; --muted:#6b7486; --accent:#2a78d6; --bad:#c62828; color-scheme: light; } }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background: radial-gradient(1200px 600px at 20% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent), var(--page); color:var(--ink); font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
.box { width:min(420px,100%); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px 28px 24px; box-shadow:0 24px 60px -24px rgba(0,0,0,.55); }
.mark { color:var(--accent); display:flex; justify-content:center; margin-bottom:10px; }
.mark svg { width:120px; height:auto; }
h1 { font-size:19px; text-align:center; margin:0 0 4px; }
p.sub { text-align:center; color:var(--muted); margin:0 0 22px; font-size:13px; }
label { display:block; font-size:12px; color:var(--ink2); margin-bottom:6px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.pw { display:flex; gap:8px; }
input[type=password], input[type=text] { flex:1; min-width:0; background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:11px 12px; font:15px inherit; font-family:inherit; }
input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.eye { background:transparent; border:1px solid var(--line); color:var(--ink2); border-radius:9px; width:44px; cursor:pointer; }
button.go { width:100%; margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:9px; padding:11px; font:600 15px inherit; font-family:inherit; cursor:pointer; }
button.go:disabled { opacity:.6; cursor:wait; }
.err { color:var(--bad); font-size:13px; min-height:20px; margin-top:10px; text-align:center; }
.row { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--ink2); text-transform:none; letter-spacing:0; font-weight:400; }
.row input { accent-color:var(--accent); }
.foot { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="mark"><svg viewBox="0 0 216 114" role="img" aria-label="Cisco"><g fill="currentColor"><rect x="6" y="40" width="12" height="34" rx="6"/><rect x="30" y="22" width="12" height="52" rx="6"/><rect x="54" y="4" width="12" height="70" rx="6"/><rect x="78" y="22" width="12" height="52" rx="6"/><rect x="102" y="40" width="12" height="34" rx="6"/><rect x="126" y="22" width="12" height="52" rx="6"/><rect x="150" y="4" width="12" height="70" rx="6"/><rect x="174" y="22" width="12" height="52" rx="6"/><rect x="198" y="40" width="12" height="34" rx="6"/></g><text x="108" y="108" text-anchor="middle" fill="currentColor" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="2">CISCO</text></svg></div>
  <h1>Global Command Center</h1>
  <p class="sub">Private executive demonstration. Enter your access key.</p>
  <label for="pw">Access key</label>
  <div class="pw"><input id="pw" type="password" autofocus required aria-describedby="err"><button type="button" class="eye" id="eye" aria-label="Show access key">👁</button></div>
  <label class="row"><input type="checkbox" id="keep" checked> Stay unlocked in this browser tab</label>
  <button class="go" id="go" type="submit">Unlock dashboard</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Content is AES-256 encrypted and opens only with the correct key.<br>All figures are simulated for demonstration.</div>
</form>
<script>
const P = /*__PAYLOAD__*/null;
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key, keep) {
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct));
  if (keep) ss.set('cgcc.k', b64(await crypto.subtle.exportKey('raw', key)));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const ss = { get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
(async () => {
  const saved = ss.get('cgcc.k');
  if (saved) { try { await open(await crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', false, ['decrypt'])); } catch (e) { ss.set('cgcc.k', ''); } }
})();
document.getElementById('eye').onclick = () => { const i = document.getElementById('pw'); i.type = i.type === 'password' ? 'text' : 'password'; };
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Please open this page over https in a modern browser.'; return; }
  btn.disabled = true; btn.textContent = 'Verifying…'; err.textContent = '';
  try {
    const key = await keyFrom(document.getElementById('pw').value);
    await open(key, document.getElementById('keep').checked);
  } catch (x) {
    btn.disabled = false; btn.textContent = 'Unlock dashboard';
    err.textContent = 'That access key is not valid.';
    document.getElementById('pw').select();
  }
};
</script>
</body>
</html>
